server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app is static: index.html plus public/about.html and
    # public/taxonomy.html copied verbatim by Vite. `$uri.html` lets
    # /about and /taxonomy resolve without the extension.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Vite emits content-hashed bundles under /assets/.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
